name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs run on the org's self-hosted ARM box (`[self-hosted, netcup-arm]`).
# That box is aarch64 Linux — the same architecture as the deploy target — so
# the release build is a native `aarch64-unknown-linux-musl` build and needs no
# zig/cargo-zigbuild (rustc links it with the self-contained musl CRT).

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt · clippy · test
    # Self-hosted: the box also serves every other org repo's checks, so a job
    # that hangs must not occupy the sole runner indefinitely.
    runs-on: [self-hosted, netcup-arm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  cross-build:
    # The name is kept so any branch protection that names this check keeps
    # matching it; on the ARM runner this is a native build, not a cross one.
    name: cross-build (aarch64 musl)
    runs-on: [self-hosted, netcup-arm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The deploy target matches the runner's host architecture, so the build
      # needs neither zig nor cargo-zigbuild: rustc links this target with the
      # musl CRT it ships (`crt-objects-fallback: musl`), with the host `cc`
      # only acting as the linker driver.
      - name: Build agent + CLI for the box target
        run: cargo build --release --target aarch64-unknown-linux-musl -p shiku -p shikud
