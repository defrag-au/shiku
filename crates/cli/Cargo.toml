[package]
name = "shiku"
version = "0.1.0"
edition = "2021"
authors = ["Damon Oehlman <damon.oehlman@gmail.com>"]
description = "Shiku CLI — deploys native services from your laptop to a Shiku-managed box"

[[bin]]
name = "shiku"
path = "src/main.rs"

[dependencies]
shiku-types = { path = "../types" }

# CLI parsing and config
clap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }

# Errors and logging
anyhow = { workspace = true }

# Secrets handling — masked prompt for `shiku secret set`.
rpassword = "7"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime — needed for SSH transport (Step 2.2) and release upload (Step 2.4)
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "fs"] }

# Release upload (Step 2.4)
sha2 = "0.10"
hex = "0.4"

# RFC3339 timestamps for release manifests
humantime = { workspace = true }
