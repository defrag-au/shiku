[package]
name = "shiku-macros"
description = "Proc-macros for declaring a Shiku service's needs (secrets, bindings, listen ports). Tracked-usage model: each call site is the declaration."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["deploy", "shiku", "macros"]
categories = ["development-tools::build-utils"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
